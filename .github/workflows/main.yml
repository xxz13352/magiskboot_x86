name: Build Static Magiskboot for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 准备交叉编译环境 (Clang & MinGW)
        run: |
          sudo apt-get update
          # 核心改动：安装 clang, lld 以及 mingw 的头文件，不再使用 gcc
          sudo apt-get install -y clang lld mingw-w64 cmake pkg-config
          rustup target add x86_64-pc-windows-gnu

      - name: 2. 拉取跨平台 Magiskboot 源码
        run: |
          git clone --depth 1 https://github.com/PinNaCode/magiskboot_build.git build_dir
          cd build_dir
          bash scripts/clone_submodules.sh

      - name: 3. 使用 Clang 执行静态交叉编译
        run: |
          cd build_dir
          mkdir build && cd build
          # 核心改动：强制 CMake 使用 Clang 并指定目标系统架构为 Windows
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_TARGET=x86_64-w64-mingw32 \
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-w64-mingw32 \
            -DCMAKE_SYSROOT=/usr/x86_64-w64-mingw32 \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTATIC_LINK=ON
          
          # 开始编译
          make -j$(nproc) magiskboot

      - name: 4. 收集并上传生成的 .exe 文件
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-windows-standalone
          path: build_dir/build/magiskboot.exe
