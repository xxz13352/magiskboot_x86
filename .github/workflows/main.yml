name: Build Magiskboot (Windows Native + Clang)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 1. 准备 MSYS2 (Clang64) 环境和依赖库
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-rust
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-lz4
            mingw-w64-clang-x86_64-xz
            mingw-w64-clang-x86_64-bzip2

      - name: 2. 拉取环境并强制更新 Magisk 到最新 Master
        shell: msys2 {0}
        run: |
          git clone https://github.com/PinNaCode/magiskboot_build.git build_dir
          cd build_dir
          
          # 第一步：根据官方文档，运行作者提供的脚本来初始化基础的 src 目录
          bash scripts/clone_submodules.sh
          
          # 第二步：进入 src 目录（这才是真正的 Magisk 源码文件夹）
          cd src
          git remote set-url origin https://github.com/topjohnwu/Magisk.git
          git fetch origin master
          # 强制拉取并签出最新的 master 分支代码
          git checkout -B master origin/master
          cd ..
          
          # 第三步：为了防止最新版 Magisk 引入了新的子模块依赖，再次运行初始化
          bash scripts/clone_submodules.sh

      - name: 3. 严格遵照 README 执行编译
        shell: msys2 {0}
        run: |
          cd build_dir
          
          # 配置 CMake (强制使用 Clang 并开启静态链接)
          CC=clang CXX=clang++ cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPREFER_STATIC_LINKING=ON
          
          # 执行构建
          cmake --build build -j $(nproc)

      - name: 4. 收集生成的原生 .exe 文件
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-windows-latest
          path: build_dir/build/magiskboot.exe
